# Temporal schema setup/update on the temporal + temporal_visibility DBs (RDS).
# --tls --tls-disable-host-verification handles RDS SSL.
# Run AFTER db-create (DBs exist) and BEFORE temporal-server starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-schema-setup
  namespace: magoneai
  labels:
    app.kubernetes.io/part-of: magoneai
    app.kubernetes.io/component: temporal-migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: temporal-schema
          image: docker.io/temporalio/admin-tools:1.29.1-tctl-1.18.4-cli-1.5.0
          command: [bash, -c]
          args:
            - |
              set -e
              echo "=== temporal schema ==="
              temporal-sql-tool --endpoint "$DB_HOST" --port 5432 --user "$DB_USER" --password "$DB_PASSWORD" \
                --plugin postgres12 --tls --tls-disable-host-verification --database temporal setup-schema -v 0.0 || echo "WARN: setup-schema (may already exist)"
              temporal-sql-tool --endpoint "$DB_HOST" --port 5432 --user "$DB_USER" --password "$DB_PASSWORD" \
                --plugin postgres12 --tls --tls-disable-host-verification --database temporal update-schema \
                -d /etc/temporal/schema/postgresql/v12/temporal/versioned
              echo "=== temporal_visibility schema ==="
              temporal-sql-tool --endpoint "$DB_HOST" --port 5432 --user "$DB_USER" --password "$DB_PASSWORD" \
                --plugin postgres12 --tls --tls-disable-host-verification --database temporal_visibility setup-schema -v 0.0 || echo "WARN: setup-schema (may already exist)"
              temporal-sql-tool --endpoint "$DB_HOST" --port 5432 --user "$DB_USER" --password "$DB_PASSWORD" \
                --plugin postgres12 --tls --tls-disable-host-verification --database temporal_visibility update-schema \
                -d /etc/temporal/schema/postgresql/v12/visibility/versioned
              echo "=== temporal schema complete ==="
          env:
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: magoneai-temporal-db-credentials, key: host } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: magoneai-temporal-db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: magoneai-temporal-db-credentials, key: password } }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
