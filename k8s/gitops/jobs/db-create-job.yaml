# Create the logical DBs Temporal + Vault need on RDS. (The app DB, magoneai_db,
# already exists — it's the RDS db_name; this Job creates only the extra logical DBs.)
# Idempotent: CREATE DATABASE guarded by a pg_database existence check
# (Postgres has no CREATE DATABASE IF NOT EXISTS).
#
# This Job ALSO validates ARCHITECTURE.md §5 (RDS reachable from a pod in a private
# subnet) and §7 (SSL: connects with sslmode=require against rds.force_ssl=1).
apiVersion: batch/v1
kind: Job
metadata:
  name: magoneai-db-create
  namespace: magoneai
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: magoneai
    spec:
      restartPolicy: Never
      containers:
        - name: db-create
          image: postgres:16-alpine
          env:
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: host } }
            - name: DB_PORT
              valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: port } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: password } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: database } }
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$DB_PASSWORD"
              # connection-string form so sslmode=require is honored (rds.force_ssl=1)
              CONN="host=$DB_HOST port=$DB_PORT user=$DB_USER dbname=$DB_NAME sslmode=require"
              for db in temporal temporal_visibility vault; do
                exists=$(psql "$CONN" -tAc "SELECT 1 FROM pg_database WHERE datname='$db'")
                if [ "$exists" = "1" ]; then
                  echo "database $db already exists — skip"
                else
                  echo "creating database $db"
                  psql "$CONN" -c "CREATE DATABASE $db"
                fi
              done
              echo "db-create complete"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
