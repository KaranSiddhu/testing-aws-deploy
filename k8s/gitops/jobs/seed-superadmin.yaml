# Seed superadmin — reads superadmin-email/password from the magoneai-app-secrets
# Secret (ESO-materialized). Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: magoneai-seed-superadmin
  namespace: magoneai
  labels:
    app.kubernetes.io/part-of: magoneai
spec:
  backoffLimit: 20 # patient: seed (wave 6) may briefly precede the alembic migration
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: magoneai-registry-credentials
      containers:
        - name: seed-superadmin
          image: docker.io/magureai/magoneai-api:sha-6a30def # keep in sync with charts/api/values.yaml
          command: [/bin/sh, -c]
          args:
            - |
              # Idempotent + ordering-robust: retry until the alembic users table exists.
              for i in $(seq 1 30); do
              python3 -c "
              import asyncio, asyncpg, bcrypt, uuid, os
              async def main():
                  conn = await asyncpg.connect(host=os.environ['DB_HOST'], port=5432,
                      user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'],
                      database=os.environ['DB_NAME'], ssl='require')
                  if not await conn.fetchval(\"SELECT to_regclass('public.users')\"):
                      await conn.close(); raise SystemExit('users table not ready')
                  email = os.environ['SUPERADMIN_EMAIL']
                  if await conn.fetchrow('SELECT id FROM users WHERE email = \$1', email):
                      print('Superadmin already exists, skipping.'); await conn.close(); return
                  pw = bcrypt.hashpw(os.environ['SUPERADMIN_PASSWORD'].encode(), bcrypt.gensalt()).decode()
                  await conn.execute('''INSERT INTO users (id, email, password_hash, display_name,
                      is_superuser, is_active, email_verified, auth_provider, mfa_enabled, created_at, updated_at)
                      VALUES (\$1, \$2, \$3, \$4, true, true, true, 'local', false, NOW(), NOW())''',
                      str(uuid.uuid4()), email, pw, 'MagoneAI Admin')
                  print('Created superadmin:', email); await conn.close()
              asyncio.run(main())
              " && exit 0
              echo "seed attempt $i: db/table not ready, retrying in 10s..."; sleep 10
              done
              echo "seed failed after retries"; exit 1
          env:
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: host } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: username } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: password } } }
            - { name: DB_NAME, valueFrom: { secretKeyRef: { name: magoneai-db-credentials, key: database } } }
            - { name: SUPERADMIN_EMAIL, valueFrom: { secretKeyRef: { name: magoneai-app-secrets, key: superadmin-email } } }
            - { name: SUPERADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: magoneai-app-secrets, key: superadmin-password } } }
