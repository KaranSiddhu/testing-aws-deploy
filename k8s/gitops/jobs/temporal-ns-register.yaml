# Register the Temporal namespace the app/workers use (TEMPORAL_NAMESPACE=magoneai
# in the charts). Waits for the frontend, idempotent. Run AFTER temporal-server is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: magoneai-temporal-ns-register
  namespace: magoneai
  labels:
    app.kubernetes.io/part-of: magoneai
    app.kubernetes.io/component: init
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: magoneai
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: temporal-ns-register
          image: docker.io/temporalio/admin-tools:1.29.1-tctl-1.18.4-cli-1.5.0
          command: [/bin/sh, -c]
          args:
            - |
              echo "Waiting for Temporal frontend..."
              until tctl --address temporal-server-frontend:7233 cluster health 2>/dev/null; do
                echo "  not ready, retry 5s..."; sleep 5
              done
              echo "Registering namespace: magoneai"
              tctl --address temporal-server-frontend:7233 \
                --namespace magoneai \
                namespace register \
                --retention 168h \
                --description "MagOneAI demo" \
                || echo "Namespace may already exist (OK)"
              echo "namespace registration complete."
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
