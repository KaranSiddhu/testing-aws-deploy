# ServiceAccounts — the targets of the Terraform Pod Identity associations
# (terraform/infra/iam-pod-identity.tf). NO IAM annotations needed: Pod Identity
# binds SA → role server-side (unlike IRSA, which needs an eks.amazonaws.com/role-arn
# annotation). The eks-pod-identity-agent injects creds at pod start.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: magoneai-app
  namespace: magoneai
  labels:
    app.kubernetes.io/part-of: magoneai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: magoneai
  labels:
    app.kubernetes.io/part-of: magoneai
