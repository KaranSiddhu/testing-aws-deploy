# =============================================================================
# FILE: k8s/gitops/foundation/namespace.yaml
#
# WHAT THIS IS
#   The very first thing created inside the cluster: the `magoneai` namespace
#   that every other MagOneAI object lives in, plus a default resource budget
#   for pods in it.
#
# WHY IT IS NEEDED
#   - A namespace is a folder for Kubernetes objects. Everything else in this
#     repo installs INTO `magoneai`, so it must exist before anything else.
#   - The LimitRange gives every container a default CPU/memory request and
#     limit. Without it, one misconfigured pod can request nothing, get
#     scheduled anywhere, and starve the whole node.
#   - The labels record who owns this namespace and which environment it is,
#     which makes cost reports and `kubectl get ns --show-labels` readable.
#
# WHEN IT RUNS
#   ArgoCD applies it in wave 20 (`k8s/apps/applications/20-foundation.yaml`),
#   before any data service or app.
#
# WHAT YOU MIGHT CHANGE
#   `client-id` and `environment` labels to describe your own deployment.
#   Raise the default limits if pods start getting throttled.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: magoneai
  labels:
    app.kubernetes.io/part-of: magoneai
    magoneai.io/client-id: testing-aws
    magoneai.io/environment: learning
---
# Default resource limits. Keeps a misconfigured pod from
# starving the node; the ML `api` overrides these with its own requests/limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: magoneai-limits
  namespace: magoneai
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      type: Container
# NOTE: NetworkPolicies are intentionally OMITTED here. On EKS they are
# INERT unless the VPC CNI network-policy feature is enabled (off by default) -
# so they would be a silent no-op. Pulling in real network
# policy is part of the deferred security baseline.
