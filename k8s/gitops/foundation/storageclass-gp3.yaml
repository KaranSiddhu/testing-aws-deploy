# gp3 as the DEFAULT StorageClass.
# The aws-ebs-csi-driver addon only ships a non-default
# gp2 class. gp3 is cheaper + faster; make it the default so PVCs
# (Vault/Qdrant/Redis/Temporal) bind without specifying a class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
