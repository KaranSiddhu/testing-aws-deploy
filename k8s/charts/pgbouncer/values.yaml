# Image is the only thing that meaningfully changes between deploys; everything
# else is hardcoded in templates/.
#
# The pgbouncer-config Secret (pgbouncer.ini + userlist.txt, with the plaintext DB
# creds) is intentionally NOT in this chart — it's provisioned by Terraform
# (secrets-bridge.tf) → Secrets Manager → ESO, and mounted here by name. So the
# credentials stay out of git. To change DB connection params, edit secrets-bridge.tf.
image:
  repository: docker.io/edoburu/pgbouncer
  tag: v1.25.1-p0
