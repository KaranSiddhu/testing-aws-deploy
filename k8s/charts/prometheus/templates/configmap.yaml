apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: "magone-production"
        environment: "production"

    rule_files:
      - "/etc/prometheus/alerts-*.yml"

    # NOTE: no `alerting:` block yet — Alertmanager arrives in P3. Until then these
    # rules evaluate and are visible in the Prometheus UI (/alerts) but are not
    # delivered anywhere. Useful for watching saturation during a load test.

    scrape_configs:
      # ---- Self ----
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # ---- App metrics (kept static so existing dashboards' job= filters keep working) ----
      - job_name: "magone-api"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["api:8000"]
        scrape_interval: 10s

      - job_name: "magone-worker"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["workflow-engine:8001"]
        scrape_interval: 10s

      - job_name: "magone-kb-worker"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["kb-worker:8002"]
        scrape_interval: 10s

      - job_name: "temporal"
        static_configs:
          - targets: ["temporal-server-frontend-headless:9090"]

      # ---- Annotation-based discovery for infra/exporters ----
      # Any Service with annotation prometheus.io/scrape: "true" is scraped.
      # Picks up kube-state-metrics + node-exporter now; future exporters (P2)
      # join automatically when their Service is annotated.
      - job_name: "kubernetes-service-endpoints"
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # ---- Node container metrics via the apiserver proxy (no direct kubelet TLS needed) ----
      - job_name: "kubernetes-nodes-cadvisor"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # ---- Kubelet metrics (gives kubelet_volume_stats_* for PVC usage) ----
      - job_name: "kubernetes-nodes-kubelet"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

  # ===========================================================================
  # Alert rules (P1 set). rule_files globs /etc/prometheus/alerts-*.yml.
  # Data-layer rules ship in P2, platform/meta + delivery in P3.
  # ===========================================================================
  alerts-cluster.yml: |
    groups:
      - name: cluster_node
        rules:
          - alert: NodeCPUSaturation
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: {{`"Node {{ $labels.instance }} CPU >85%"`}}
              description: {{`"5m CPU usage on {{ $labels.instance }} is {{ printf \"%.0f\" $value }}%."`}}
          - alert: NodeMemoryPressure
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: {{`"Node {{ $labels.instance }} memory >90%"`}}
              description: {{`"Available memory on {{ $labels.instance }} is below 10%."`}}
          - alert: NodeFilesystemAlmostFull
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) * 100 > 85
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: {{`"Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} >85% full"`}}
              description: {{`"Disk usage on {{ $labels.instance }}:{{ $labels.mountpoint }} is high."`}}

  alerts-workload.yml: |
    groups:
      - name: workload_resources
        rules:
          - alert: PodMemoryNearLimit
            expr: |
              container_memory_working_set_bytes{namespace="magoneai", container!="", container!="POD"}
                / on(namespace,pod,container)
              kube_pod_container_resource_limits{namespace="magoneai", resource="memory"} > 0.9
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: {{`"Pod {{ $labels.pod }}/{{ $labels.container }} memory >90% of limit"`}}
              description: {{`"OOMKill risk. Working set is {{ humanizePercentage $value }} of the memory limit."`}}
          - alert: PodCPUThrottlingHigh
            expr: |
              rate(container_cpu_cfs_throttled_periods_total{namespace="magoneai", container!=""}[5m])
                / rate(container_cpu_cfs_periods_total{namespace="magoneai", container!=""}[5m]) > 0.25
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: {{`"Pod {{ $labels.pod }}/{{ $labels.container }} CPU throttled >25%"`}}
              description: {{`"CPU limit may be too low for the load."`}}
          - alert: ContainerOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{namespace="magoneai", reason="OOMKilled"} == 1
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: {{`"Container {{ $labels.pod }}/{{ $labels.container }} was OOMKilled"`}}
              description: {{`"Raise the memory limit or reduce concurrency/batch size."`}}
          - alert: PodCrashLooping
            expr: kube_pod_container_status_waiting_reason{namespace="magoneai", reason="CrashLoopBackOff"} == 1
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: {{`"Pod {{ $labels.pod }} is crash-looping"`}}
              description: {{`"Container {{ $labels.container }} stuck in CrashLoopBackOff."`}}
          - alert: DeploymentReplicasUnavailable
            expr: kube_deployment_status_replicas_unavailable{namespace="magoneai"} > 0
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: {{`"Deployment {{ $labels.deployment }} has unavailable replicas"`}}
              description: {{`"{{ $value }} replica(s) unavailable for 10m."`}}

  alerts-capacity.yml: |
    groups:
      - name: capacity
        rules:
          - alert: PVCUsageHigh
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.8
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: {{`"PVC {{ $labels.persistentvolumeclaim }} >80% full"`}}
              description: {{`"Volume in namespace {{ $labels.namespace }} is running low on space."`}}
