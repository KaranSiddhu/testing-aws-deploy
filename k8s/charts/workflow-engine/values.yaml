# Image is the only thing that meaningfully changes between deploys.
# Everything else is hardcoded in templates/.
#
# Shared with api + kb-worker: same image, different command.
image:
  repository: docker.io/magureai/magoneai-api
  tag: ""                    # REQUIRED — image tag to deploy
replicaCount: 1
appEnv: ""                  # REQUIRED — development (no domain) / production (with domain)
appUrl: ""                  # REQUIRED — APP_URL/FRONTEND_URL/CORS_ORIGINS from spec domain

# Transactional email. REQUIRED — bare render fails.
email:
  provider: ""    # e.g. resend
  from: ""        # sender address
  fromName: ""    # sender display name
  welcomeCc: ""   # optional — CC on welcome email (env omitted if empty)
