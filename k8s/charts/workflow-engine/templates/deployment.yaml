apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine
  labels:
    {{- include "workflow-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "workflow-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workflow-engine.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: magoneai-app
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: magoneai-registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: vault-token-check
          secret:
            secretName: magoneai-app-secrets
            items:
              - key: vault-token
                path: vault-token
      initContainers:
        # Block until the Vault root token is seeded into app-secrets (see api chart).
        - name: wait-for-vault-token
          image: busybox:1.36
          command: ["sh", "-c", "until [ -s /vault/vault-token ]; do echo 'waiting for vault-token to be seeded...'; sleep 5; done"]
          volumeMounts:
            - name: vault-token-check
              mountPath: /vault
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: [python, -m, be.worker]
          ports:
            - name: metrics
              containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: APP_ENV
              value: {{ required "appEnv is required" .Values.appEnv | quote }}
            - name: CORS_ORIGINS
              value: {{ required "appUrl is required" .Values.appUrl | quote }}
            - name: LOG_FORMAT
              value: "json"
            - name: SERVICE_NAME
              value: "worker"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: magoneai-db-credentials
                  key: connection-string
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magoneai-app-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: magoneai-app-secrets
                  key: app-secret-key
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: magoneai-s3-credentials
                  key: endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: magoneai-s3-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: magoneai-s3-credentials
                  key: secret-key
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: magoneai-s3-credentials
                  key: bucket
            - name: MINIO_USE_SSL
              value: "true"
            - name: QDRANT_HOST
              value: qdrant
            - name: QDRANT_PORT
              value: "6333"
            # Dense embedding via TEI (charts/tei-dense). Sparse BM25 stays
            # in-process via fastembed — no second model service needed.
            - name: EMBEDDING_DENSE_URL
              value: "http://tei-dense:80"
            - name: VAULT_URL
              value: "http://vault:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: magoneai-app-secrets
                  key: vault-token
            - name: MCP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: magoneai-app-secrets
                  key: mcp-service-token
            - name: API_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: magoneai-app-secrets
                  key: api-key-encryption-key
            - name: SYSTEM_EMAIL_PROVIDER
              value: {{ required "email.provider is required" .Values.email.provider | quote }}
            - name: SYSTEM_EMAIL_FROM
              value: {{ required "email.from is required" .Values.email.from | quote }}
            - name: SYSTEM_EMAIL_FROM_NAME
              value: {{ required "email.fromName is required" .Values.email.fromName | quote }}
            - name: SYSTEM_EMAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: magoneai-app-secrets
                  key: system-email-api-key
            - name: TEMPORAL_HOST
              value: "temporal-server-frontend:7233"
            - name: TEMPORAL_NAMESPACE
              value: magoneai
            - name: TEMPORAL_TASK_QUEUE
              value: magoneai
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: APP_URL
              value: {{ required "appUrl is required" .Values.appUrl | quote }}
            - name: FRONTEND_URL
              value: {{ required "appUrl is required" .Values.appUrl | quote }}
            - name: FIXED_SAMPLING_MODELS
              value: "gpt-5,gpt-5.4-nano,gpt-5.4-mini,o1,o1-mini,o1-preview,o3-mini"
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: TRANSFORMERS_CACHE
              value: /tmp/hf-cache
            - name: XDG_CACHE_HOME
              value: /tmp/hf-cache
          volumeMounts:
            - name: model-cache
              mountPath: /tmp/hf-cache
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 2000m
              memory: 10Gi
          startupProbe:
            httpGet:
              path: /
              port: 8001
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8001
            periodSeconds: 30
            failureThreshold: 3
