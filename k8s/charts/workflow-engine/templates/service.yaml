apiVersion: v1
kind: Service
metadata:
  name: workflow-engine
  labels:
    {{- include "workflow-engine.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "workflow-engine.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
