# Idempotent Vault init — ArgoCD PostSync hook.
# Inits Vault (KMS auto-unseal → recovery keys), enables KV v2, and writes the root
# token to its own SM secret → ESO merges it into app-secrets → api/workers use it.
# Data is disposable: a recreate is a fresh Vault → always re-inits → new token.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  labels:
    app.kubernetes.io/part-of: magoneai
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: magoneai-app # Pod Identity → SM Get/Put
      containers:
        - name: vault-init
          image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
          command: [sh, -ec]
          args:
            - |
              pip install --quiet --no-cache-dir 'boto3~=1.35.0' >/dev/null 2>&1
              python3 - <<'PY'
              import os, json, time, urllib.request, urllib.error
              V="http://vault:8200"
              def vault(path, method="GET", body=None, token=None):
                  data=json.dumps(body).encode() if body is not None else None
                  req=urllib.request.Request(V+path, data=data, method=method)
                  if token: req.add_header("X-Vault-Token", token)
                  try:
                      r=urllib.request.urlopen(req, timeout=15); return r.status, json.loads(r.read() or "{}")
                  except urllib.error.HTTPError as e:
                      return e.code, json.loads(e.read() or "{}")
              # wait reachable
              for _ in range(60):
                  try: vault("/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true"); break
                  except Exception: time.sleep(5)
              _, st = vault("/v1/sys/init")
              if st.get("initialized"):
                  print("Vault already initialized (root token not recoverable); skipping."); raise SystemExit(0)
              _, out = vault("/v1/sys/init", "POST", {"recovery_shares":1,"recovery_threshold":1})
              root = out["root_token"]; print("Vault initialized.")
              code,_ = vault("/v1/sys/mounts/secret","POST",{"type":"kv","options":{"version":"2"}}, token=root)
              print("enable kv v2:", code)
              import boto3
              sm=boto3.client("secretsmanager", region_name=os.environ["AWS_REGION"])
              name=os.environ["VAULT_TOKEN_SM"]
              sm.put_secret_value(SecretId=name, SecretString=json.dumps({"vault-token": root}))
              print("Wrote vault-token to", name, "- ESO merges it into app-secrets.")
              PY
          env:
            - { name: AWS_REGION, valueFrom: { secretKeyRef: { name: deployment-config, key: region } } }
            - { name: VAULT_TOKEN_SM, value: "{{ required "vaultTokenSmName is required" .Values.vaultTokenSmName }}" }
