apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: magoneai
    app.kubernetes.io/component: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: magoneai
        app.kubernetes.io/component: vault
    spec:
      serviceAccountName: vault # Pod Identity → KMS (unseal)
      initContainers:
        # 1) Create Vault's storage tables on RDS (Vault requires them to initialize).
        - name: db-init
          image: docker.io/postgres:16-alpine
          command: [sh, -ec]
          args:
            - |
              psql "host=$DB_HOST port=5432 user=$DB_USER dbname=vault sslmode=require" <<'SQL'
              CREATE TABLE IF NOT EXISTS vault_kv_store (
                parent_path TEXT COLLATE "C" NOT NULL, path TEXT COLLATE "C",
                key TEXT COLLATE "C", value BYTEA, CONSTRAINT pkey PRIMARY KEY (path, key));
              CREATE INDEX IF NOT EXISTS parent_path_idx ON vault_kv_store (parent_path);
              CREATE TABLE IF NOT EXISTS vault_ha_locks (
                ha_key TEXT COLLATE "C" NOT NULL, ha_identity TEXT COLLATE "C" NOT NULL,
                ha_value TEXT COLLATE "C", valid_until TIMESTAMP WITH TIME ZONE NOT NULL,
                CONSTRAINT ha_key PRIMARY KEY (ha_key));
              SQL
          env:
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: deployment-config, key: db-host } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: magoneai-vault-db-credentials, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: magoneai-vault-db-credentials, key: password } } }
        # 2) Render vault.hcl from the template using env (DB password is alphanumeric → safe in sed).
        - name: render-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [sh, -ec]
          args:
            - |
              sed -e "s|__DB_USER__|$DB_USER|" -e "s|__DB_PASSWORD__|$DB_PASSWORD|" -e "s|__DB_HOST__|$DB_HOST|" \
                /vault/tpl/vault.hcl > /vault/config/vault.hcl
              echo "rendered vault.hcl"
          env:
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: deployment-config, key: db-host } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: magoneai-vault-db-credentials, key: username } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: magoneai-vault-db-credentials, key: password } } }
          volumeMounts:
            - { name: config, mountPath: /vault/config }
            - { name: tpl, mountPath: /vault/tpl, readOnly: true }
      containers:
        - name: vault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [vault, server, -config=/vault/config/vault.hcl]
          ports:
            - { name: http, containerPort: 8200 }
          env:
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: VAULT_API_ADDR, value: "http://$(POD_IP):8200" }
            - { name: AWS_REGION, valueFrom: { secretKeyRef: { name: deployment-config, key: region } } }
            - { name: VAULT_AWSKMS_SEAL_KEY_ID, valueFrom: { secretKeyRef: { name: deployment-config, key: kms-key-id } } }
          securityContext:
            capabilities: { add: [IPC_LOCK] }
          livenessProbe:
            httpGet: { path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200", port: 8200 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: "/v1/sys/health?standbyok=true&uninitcode=200", port: 8200 }
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /vault/config }
      volumes:
        - { name: config, emptyDir: {} }
        - { name: tpl, configMap: { name: vault-config-tpl } }
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: magoneai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: vault
  ports:
    - { name: http, port: 8200, targetPort: 8200 }
