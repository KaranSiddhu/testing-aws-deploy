# Headless service for stable DNS (required by StatefulSet's serviceName)
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  labels:
    {{- include "qdrant.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "qdrant.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
