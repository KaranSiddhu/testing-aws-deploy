# ClusterIP service for app access (api, kb-worker, etc. talk to qdrant:6333)
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    {{- include "qdrant.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "qdrant.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
