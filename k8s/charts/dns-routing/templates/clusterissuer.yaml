apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ required "dns-routing.email is required" .Values.email | quote }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      # HTTP-01: cert-manager serves the challenge token over the nginx ingress.
      # Needs the hostname publicly resolvable (delegate DNS first) and port 80
      # reachable. No Route53 / DNS-01 permissions required.
      - http01:
          ingress:
            class: nginx
