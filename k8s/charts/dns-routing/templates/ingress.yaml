apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magoneai
  namespace: magoneai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ required "dns-routing.host is required" .Values.host | quote }}]
      secretName: magoneai-tls
  rules:
    # All product services share one host (and thus one cert) via path routing.
    - host: {{ required "dns-routing.host is required" .Values.host | quote }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 8000 } } } }
          - { path: /hub, pathType: Prefix, backend: { service: { name: consumer, port: { number: 3000 } } } }
          - { path: /superadmin, pathType: Prefix, backend: { service: { name: superadmin, port: { number: 3000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } }
