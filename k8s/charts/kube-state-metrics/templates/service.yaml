apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    {{- include "ksm.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "ksm.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
