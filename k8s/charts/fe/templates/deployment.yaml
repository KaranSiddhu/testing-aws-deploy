apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  labels:
    {{- include "fe.labels" . | nindent 4 }}
spec:
  replicas: 2

  selector:
    matchLabels:
      {{- include "fe.selectorLabels" . | nindent 6 }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        {{- include "fe.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false

      # 1001 comes from fe/Dockerfile:
      #   adduser -S -u 1001 -G nodejs nextjs
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # No init container. The frontend owns no database and has nothing to
      # migrate.
      containers:
        - name: fe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

          env:
            # The line the proxy refactor bought us.
            #
            # Read at RUNTIME by src/app/api/[...path]/route.ts, on every
            # request. So the same image works everywhere and only this value
            # changes: http://be:8000 here, whatever the Service is called on
            # EKS later.
            #
            # A NEXT_PUBLIC_ variable could not do this: those are frozen into
            # the JavaScript bundle during `next build`, and setting one here
            # would do nothing at all.
            - name: API_INTERNAL_URL
              value: "http://be:8000"

          # Next.js has no dedicated health endpoint, so both probes hit "/".
          # Same split as the backend: liveness restarts, readiness only pulls
          # the pod out of the Service.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Lower than the backend: serving pre-built pages is much cheaper
          # than running Python and talking to a database.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
