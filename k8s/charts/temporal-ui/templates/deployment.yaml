apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  labels:
    {{- include "temporal-ui.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "temporal-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: magoneai
        app.kubernetes.io/component: temporal-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal-server-frontend:7233"
            - name: TEMPORAL_PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
