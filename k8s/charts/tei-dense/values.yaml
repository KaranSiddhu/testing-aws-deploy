# Image is the only thing that meaningfully changes between deploys.
# Everything else (model id, batch tokens, PVC, probes, resources) is
# hardcoded in templates/ to mirror the same convention used by qdrant.
#
# GPU later: swap to a cuda-* tag + add deploy.resources to the statefulset.
image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: cpu-1.9
