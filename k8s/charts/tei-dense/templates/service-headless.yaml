# Headless service for stable DNS (required by StatefulSet's serviceName).
apiVersion: v1
kind: Service
metadata:
  name: tei-dense-headless
  labels:
    {{- include "tei-dense.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "tei-dense.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 80
