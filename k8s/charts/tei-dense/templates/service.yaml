# ClusterIP service for app access — api / kb-worker / workflow-engine talk
# to tei-dense:80 (the URL the app code defaults to via EMBEDDING_DENSE_URL).
apiVersion: v1
kind: Service
metadata:
  name: tei-dense
  labels:
    {{- include "tei-dense.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tei-dense.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 80
