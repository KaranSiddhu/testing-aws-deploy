# ESO reads AWS Secrets Manager using the external-secrets controller's identity.
# No keys/secretRef: auth is via EKS Pod Identity — the external-secrets SA is bound
# to the eso IAM role (terraform/infra/secrets-bridge.tf) → default cred chain.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
