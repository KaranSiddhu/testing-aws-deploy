{{- $sm := required "eso-config: .Values.smPrefix is required" .Values.smPrefix -}}
# One ExternalSecret per Secrets Manager secret. `dataFrom.extract` copies every JSON
# key from the SM secret into the k8s Secret verbatim — so the charts/jobs find the
# exact keys they expect (magoneai-db-credentials.connection-string, etc.).
#
# SM secret names carry the deployment prefix ({{ $sm }}-*), set via smPrefix.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magoneai-db-credentials
  namespace: magoneai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: magoneai-db-credentials, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $sm }}-db-credentials }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magoneai-temporal-db-credentials
  namespace: magoneai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: magoneai-temporal-db-credentials, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $sm }}-temporal-db-credentials }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magoneai-vault-db-credentials
  namespace: magoneai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: magoneai-vault-db-credentials, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $sm }}-vault-db-credentials }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magoneai-app-secrets
  namespace: magoneai
spec:
  refreshInterval: 1m # short: picks up vault-token written by the vault-init hook
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: magoneai-app-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $sm }}-app-secrets }
  # vault-token lives in its OWN SM secret (re-apply-safe) — merge it into this Secret
  # so the app/initContainer find it under the same magoneai-app-secrets key.
  data:
    - secretKey: vault-token
      remoteRef: { key: {{ $sm }}-vault-token, property: vault-token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magoneai-s3-credentials
  namespace: magoneai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: magoneai-s3-credentials, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $sm }}-s3-credentials }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-config
  namespace: magoneai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: pgbouncer-config, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $sm }}-pgbouncer-config }
---
# Non-secret deployment config (kms key id, region, db host) — vault + temporal read it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: deployment-config
  namespace: magoneai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: deployment-config, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $sm }}-deployment-config }
---
# Docker Hub pull secret — rendered as a proper dockerconfigjson-typed Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magoneai-registry-credentials
  namespace: magoneai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: magoneai-registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract: { key: {{ $sm }}-registry-credentials }
