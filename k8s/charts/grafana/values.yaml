# Image is the only thing that meaningfully changes between deploys; everything else
# is hardcoded in templates/. Dashboards under dashboards/ are rendered into the
# grafana-dashboards ConfigMap by templates/dashboards-configmap.yaml.
image:
  repository: docker.io/grafana/grafana
  tag: "12.3.3"

# Public hostname for Grafana, e.g. grafana.<domain>. Empty host ⇒ no Ingress and
# Grafana is reached via `kubectl port-forward`.
host: ""

ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt # the ClusterIssuer the dns-routing chart creates
  # IP allowlist (office/VPN CIDRs, comma-separated) required to expose Grafana.
  # Empty ⇒ no Ingress is created (Grafana stays internal, port-forward only).
  # Not a secret, but operator-specific — set it in the grafana Application valuesObject.
  allowedCidrs: ""

# Which key in magoneai-app-secrets holds the Grafana admin password — its own value,
# decoupled from the superadmin password (both provisioned by Terraform).
adminPasswordKey: grafana-admin-password
