apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  # Each dashboard JSON under dashboards/ is embedded verbatim. Grafana's file
  # provider (see configmap.yaml -> dashboards.yml) loads them into the
  # "Magure AI" folder. .Files.Get inserts contents literally, so Grafana
  # legend tokens like {{`{{pod}}`}} are NOT processed by Helm.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
