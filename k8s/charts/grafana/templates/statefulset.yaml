apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      {{- include "grafana.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafana.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "magure_ops"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magoneai-app-secrets
                  # Which app-secrets key holds the Grafana admin password — its own value,
                  # decoupled from superadmin (provisioned by Terraform secrets-bridge.tf).
                  key: {{ .Values.adminPasswordKey | quote }}
            - name: GF_SERVER_ROOT_URL
              # host is empty for no-domain deployments (access via port-forward → default root_url).
              value: {{ if .Values.host }}"https://{{ .Values.host }}"{{ else }}"http://localhost:3000"{{ end }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-json
              mountPath: /etc/grafana/provisioning/dashboards/json
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yml
                path: datasources.yml
        - name: dashboard-provider
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yml
                path: dashboards.yml
        - name: dashboards-json
          configMap:
            name: grafana-dashboards
            # Optional: the grafana-dashboards ConfigMap is provisioned out-of-band
            # (not by this chart). Mark optional so Grafana
            # starts cleanly on a fresh cluster even before dashboards are added.
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: grafana-data
      spec:
        storageClassName: gp3
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
