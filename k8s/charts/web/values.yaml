# Image is the only thing that meaningfully changes between deploys.
# Everything else (replicas, resources, probes, env, securityContext) is
# hardcoded in templates/.
#
# To bump the running version: edit `tag` (and `repository` if also flipping
# to a new namespace). PR + merge. Auto-sync rolls the new image.
image:
  repository: docker.io/magureai/magoneai-web
  tag: ""        # REQUIRED — image tag to deploy
replicaCount: 1
