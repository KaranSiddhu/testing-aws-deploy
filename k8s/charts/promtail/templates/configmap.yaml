apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    {{- include "promtail.labels" . | nindent 4 }}
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.magoneai.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: magoneai-pods
        static_configs:
          - targets: [localhost]
            labels:
              namespace: magoneai
              __path__: /var/log/pods/magoneai_*/*/*.log
        pipeline_stages:
          - cri: {}
          # Extract pod name and container from file path
          - regex:
              source: filename
              expression: '/var/log/pods/magoneai_(?P<pod>[^/]+)_[^/]+/(?P<container>[^/]+)/.*'
          - labels:
              pod:
              container:
          # Parse JSON structured logs from our apps
          - json:
              expressions:
                level: level
                logger: logger
                message: event
                msg: msg
                timestamp: timestamp
                trace_id: trace_id
                worker_id: worker_id
                user_id: user_id
                org_id: org_id
          - template:
              source: level
              template: "{{`{{ if .level }}{{ .level | ToUpper }}{{ else }}INFO{{ end }}`}}"
          - labels:
              level:
              worker_id:
          - timestamp:
              source: timestamp
              format: RFC3339Nano
              fallback_formats:
                - RFC3339
                - "2006-01-02 15:04:05"
          - match:
              selector: '{namespace="magoneai"} |~ "GET /health"'
              action: drop
          - match:
              selector: '{namespace="magoneai"} |~ "healthcheck"'
              action: drop
