# The frontend.
#
# Read this next to 20-be.yaml. They are close to identical: same labels, same
# structure, same probe shape, same resource block. Only the name, the image,
# the port and two env vars differ.
#
# THAT is the point of Phase 2. Two files, ~80% duplicated. Now imagine 27
# applications across 3 clients. Phase 3 replaces both with one Helm chart.

---
# =============================================================================
# Service. Identical in shape to the backend's, different port.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: fe
  namespace: dummy-hello
  labels:
    app.kubernetes.io/name: fe
    app.kubernetes.io/part-of: dummy-hello
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fe
  ports:
    - name: http
      port: 3000
      targetPort: http

---
# =============================================================================
# Deployment.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  namespace: dummy-hello
  labels:
    app.kubernetes.io/name: fe
    app.kubernetes.io/part-of: dummy-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fe

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fe
        app.kubernetes.io/part-of: dummy-hello
    spec:
      # No initContainer here. The frontend owns no database and has nothing to
      # migrate.
      containers:
        - name: fe
          image: docker.io/karansiddhu/dummy-hello-fe:dev-7adf167
          imagePullPolicy: IfNotPresent

          env:
            # THE LINE THAT PAID FOR THE PROXY REFACTOR.
            #
            # In compose this was http://be:8000. Here it is http://be:8000 as
            # well, because "be" happens to be the Service name too. On EKS it
            # will be whatever the Service is called there.
            #
            # The image never changes. Only this value does.
            #
            # Had we kept NEXT_PUBLIC_API_URL, this would be impossible: that
            # value is frozen into the JavaScript during `next build`, so
            # setting it here would do precisely nothing, and we would need a
            # separate image per environment.
            - name: API_INTERNAL_URL
              value: "http://be:8000"

          ports:
            - name: http
              containerPort: 3000

          # Next.js has no dedicated health endpoint, so both probes hit "/".
          # Same split as the backend: liveness restarts, readiness only
          # removes it from the Service.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Lower than the backend: serving pre-built pages is much cheaper
          # than running Python and talking to a database.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true

            # Must be a NUMBER. See the long note in 20-be.yaml: Kubernetes
            # cannot resolve the `USER nextjs` name from the Dockerfile and
            # refuses to start the container without a numeric uid.
            #
            # 1001 is the uid from fe/Dockerfile:
            #   RUN addgroup -g 1001 nodejs && adduser -S -u 1001 -G nodejs nextjs
            runAsUser: 1001

            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
