# PostgreSQL, running inside the cluster.
#
# In Phase 7 this file gets deleted and replaced by AWS RDS, and the only thing
# that changes for the application is the DATABASE_URL inside a Secret. That is
# worth remembering when you get there.
#
# Two objects here: a headless Service and a StatefulSet.

---
# =============================================================================
# Service: a stable name other pods can use.
#
# Pods get a new IP every restart, so nothing should ever talk to a pod IP. A
# Service is a fixed name that always points at the right pod. Kubernetes runs
# an internal DNS server, so "postgres" resolves from anywhere in this
# namespace, and "postgres.dummy-hello.svc.cluster.local" from anywhere in the
# cluster.
#
# clusterIP: None makes it "headless": DNS returns the pod's own IP rather than
# a load-balancer address. That is what a StatefulSet wants, because its pods
# are not interchangeable, unlike stateless API replicas.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dummy-hello
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dummy-hello
spec:
  clusterIP: None
  selector:
    # This is the whole mechanism: the Service finds pods by LABEL, not by name.
    # If this selector does not match the pod template's labels below, the
    # Service exists, has no endpoints, and every connection is refused. It is
    # the single most common self-inflicted Kubernetes bug.
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# =============================================================================
# StatefulSet: a Deployment for things that have state.
#
# A Deployment gives pods random names and treats them as interchangeable. A
# StatefulSet gives stable names (postgres-0, postgres-1) and, crucially, gives
# EACH pod its OWN disk that survives a restart.
#
# In the real repos: Qdrant, Redis, Loki, Grafana and Prometheus are all
# StatefulSets for this reason. The API and web pods are Deployments.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dummy-hello
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dummy-hello
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres

  template:
    metadata:
      labels:
        # MUST match spec.selector.matchLabels above AND the Service's
        # selector. Three places, same value. Helm removes this duplication in
        # Phase 3 with a named template.
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: dummy-hello
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          env:
            # valueFrom.secretKeyRef reads a value out of a Secret at pod start
            # and hands it over as an environment variable. The password never
            # appears in this file, so this file is safe to commit.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB

            # Store the data in a SUBDIRECTORY of the mounted volume, not at its
            # root. Some storage backends drop a lost+found directory at the
            # root of a fresh volume, and Postgres refuses to initialise into a
            # directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          ports:
            - name: postgres
              containerPort: 5432

          # readiness: can it accept connections yet? Postgres takes a few
          # seconds to start. Until this passes, the Service sends it no
          # traffic, which is what stops the app connecting too early.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5

          # liveness: is it alive at all? If this fails the pod is RESTARTED, so
          # the check is kept deliberately shallow and the timings generous.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

          # requests = what the scheduler reserves on a node when placing this
          #            pod. Too low and nodes get overcommitted.
          # limits   = the hard ceiling. Exceed the memory limit and the
          #            container is OOMKilled. Exceed the CPU limit and it is
          #            throttled, which shows up as mysterious slowness rather
          #            than an error.
          #
          # compose had no equivalent, which is why a runaway container there
          # can take down your whole laptop.
          resources:
            requests:
              cpu: 100m # 0.1 of a CPU core
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  # volumeClaimTemplates is StatefulSet-only. Kubernetes creates one
  # PersistentVolumeClaim per pod, and it SURVIVES the pod being deleted.
  #
  # It also survives `kubectl delete statefulset`. To actually delete the data
  # you have to delete the PVC by hand, which is a deliberate safety net.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
