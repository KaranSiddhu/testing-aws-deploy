# A Namespace is a folder inside the cluster. Everything for this app lives in
# one, so `kubectl delete namespace dummy-hello` removes all of it in one go.
#
# The real deployments do exactly this: magoneai-trinity, magoneai-neo,
# magoneai. One namespace per environment.

apiVersion: v1
kind: Namespace
metadata:
  name: dummy-hello
  labels:
    # Standard Kubernetes labels. Not decoration: tools select on them, and
    # every Helm chart in the real repos emits this same set from its
    # _helpers.tpl. Getting used to them now makes those charts readable.
    app.kubernetes.io/part-of: dummy-hello
    app.kubernetes.io/managed-by: kubectl

    # Pod Security Standards. "baseline" blocks the obviously dangerous things
    # (host network, privileged containers) while allowing normal workloads.
    #
    # Worth knowing: AWNIC's monitoring namespace has to be "privileged"
    # instead, because node-exporter needs hostNetwork and hostPID. Under
    # "baseline" the DaemonSet is accepted and no pod is ever created, which is
    # a silent failure that reads as a working control in a review.
    pod-security.kubernetes.io/enforce: baseline
