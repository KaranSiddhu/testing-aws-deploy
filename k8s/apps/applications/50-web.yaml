apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:KaranSiddhu/testing-aws-magure-deploy.git
    targetRevision: main
    path: k8s/charts/web
    helm:
      valuesObject:
        image:
          tag: sha-53e8f42
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: magoneai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 8
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
